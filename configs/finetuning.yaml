# ─────────────────────────────────────────────────────────────────────
# Fine-tuning Configuration — Qwen3-1.7B Company Assistant LoRA/QLoRA
# ─────────────────────────────────────────────────────────────────────
# التدريب: python scripts/train_lora.py --config configs/finetuning.yaml
# ─────────────────────────────────────────────────────────────────────

# ── Base Model ────────────────────────────────────────────────────────
base_model: "Qwen/Qwen3-1.7B"

# ── Dataset ───────────────────────────────────────────────────────────
dataset_dir: "data/fine_tuning"
train_file: "train.jsonl"
validation_file: "validation.jsonl"
test_file: "test.jsonl"

# ── Output ────────────────────────────────────────────────────────────
output_dir: "adapters/qwen3-company-assistant-lora"

# ── Quantization & Precision ──────────────────────────────────────────
method: "qlora"         # options: "qlora" (4-bit) | "lora" (full precision)
load_in_4bit: true      # QLoRA: quantize base model to 4-bit (bitsandbytes)

# bf16/fp16: set to "auto" for automatic detection at runtime.
# train_lora.py will detect torch.cuda.is_bf16_supported() and override these.
bf16: "auto"
fp16: "auto"

# ── Sequence ──────────────────────────────────────────────────────────
max_seq_length: 2048    # Qwen3-1.7B supports up to 32768 — keep 2048 safe

# ── LoRA Hyperparameters ──────────────────────────────────────────────
lora_r: 16              # rank — higher = more capacity, more memory
lora_alpha: 32          # scaling = alpha / r = 2.0
lora_dropout: 0.05

# target_modules: standard for Qwen2/Qwen3 architecture
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# ── Training Hyperparameters ──────────────────────────────────────────
learning_rate: 0.0002        # 2e-4 — standard for LoRA SFT
num_train_epochs: 2          # start with 2 epochs, increase if underfitting
per_device_train_batch_size: 2   # conservative — safe for 8GB GPU
gradient_accumulation_steps: 8  # effective batch = 2*8 = 16
warmup_ratio: 0.03
weight_decay: 0.01

# ── Logging & Saving ─────────────────────────────────────────────────
logging_steps: 25
save_steps: 200
eval_steps: 200
save_total_limit: 3          # keep only the 3 best checkpoints

# ── Qwen3-specific ───────────────────────────────────────────────────
use_no_think: true           # dataset trained with /no_think — keep consistent

# ── Reporting ────────────────────────────────────────────────────────
report_to: "none"            # options: "wandb" | "tensorboard" | "none"
