version: "3.9"

services:
  # ─── SQL Server ──────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jobmagnet_sqlserver
    restart: unless-stopped
    environment:
      SA_PASSWORD: "JobMagnet@2026!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - jobmagnet_network
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'JobMagnet@2026!' -Q 'SELECT 1' -No" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── MinIO (File Storage - S3 Compatible) ────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: jobmagnet_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "jobmagnet_admin"
      MINIO_ROOT_PASSWORD: "JobMagnet@2026!"
    ports:
      - "9010:9000" # API endpoint (for uploads/downloads)
      - "9011:9001" # Web Console UI
    volumes:
      - minio_data:/data
    networks:
      - jobmagnet_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── MinIO Init (creates buckets on startup) ─────────────────────────────────
  minio_init:
    image: minio/mc:latest
    container_name: jobmagnet_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 jobmagnet_admin 'JobMagnet@2026!';
        mc mb --ignore-existing myminio/avatars;
        mc mb --ignore-existing myminio/resumes;
        mc mb --ignore-existing myminio/company-logos;
        mc mb --ignore-existing myminio/company-documents;
        mc mb --ignore-existing myminio/portfolio;
        mc mb --ignore-existing myminio/project-files;
        mc mb --ignore-existing myminio/chat-attachments;
        mc anonymous set download myminio/avatars;
        mc anonymous set download myminio/company-logos;
        mc anonymous set download myminio/portfolio;
        echo 'All buckets created successfully!';
      "
    networks:
      - jobmagnet_network

  # ─── Database UI Manager (Adminer) ──────────────────────────────────────────
  db-manager:
    image: adminer:latest
    container_name: jobmagnet_db_manager
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - jobmagnet_network

# ─── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  sqlserver_data:
    name: jobmagnet_sqlserver_data
  minio_data:
    name: jobmagnet_minio_data
  api_logs:
    name: jobmagnet_api_logs

# ─── Network ─────────────────────────────────────────────────────────────────
networks:
  jobmagnet_network:
    name: jobmagnet_network
    driver: bridge
