<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقابلة MAESTA الذكية</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #0f172a;
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .interview-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 100%;
            max-width: 600px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .chat-header {
            padding: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scroll-behavior: smooth;
        }
        .chat-footer {
            padding: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .bubble {
            max-width: 85%;
            padding: 16px;
            border-radius: 18px;
            margin-bottom: 16px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }
        .ai-bubble {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            align-self: flex-start;
            border-bottom-right-radius: 4px;
        }
        .candidate-bubble {
            background: #3b82f6;
            color: white;
            align-self: flex-end;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .consent-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .btn-primary {
            background: #3b82f6;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
        }
        .btn-outline-secondary {
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #94a3b8;
        }
        .input-group input {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 12px;
            padding: 14px;
        }
        .input-group input:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #3b82f6;
            box-shadow: none;
            color: white;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .typing-indicator { font-style: italic; color: #64748b; font-size: 0.9rem; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="interview-card">
    <div class="chat-header">
        <h4 class="mb-0">مقابلة MAESTA الذكية</h4>
        <p class="text-muted small mb-0">نظام توظيف ذكي وآمن</p>
    </div>

    <div class="chat-body d-flex flex-column" id="chat-body">
        <!-- Consent View -->
        <div id="consent-view" class="text-center mt-5">
            <div class="consent-box">
                <h5>مرحباً بك في مقابلة التوظيف</h5>
                <p class="text-muted">هذه المقابلة تتم بواسطة الذكاء الاصطناعي. سيتم طرح بضعة أسئلة عليك لتقييم مدى ملاءمتك للوظيفة. العملية آمنة وتحت مراقبة بشرية.</p>
                <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">
                    <button class="btn btn-primary" onclick="handleConsent('accepted')">أوافق على البدء</button>
                    <button class="btn btn-outline-secondary" onclick="handleConsent('declined')">لا أوافق</button>
                </div>
            </div>
        </div>

        <!-- Chat Log -->
        <div id="chat-log" style="display: none;">
            <!-- Messages will appear here -->
        </div>
        
        <div id="typing" class="typing-indicator" style="display: none;">الذكاء الاصطناعي يكتب الآن...</div>
    </div>

    <div class="chat-footer" id="chat-footer" style="display: none;">
        <div class="input-group">
            <input type="text" id="answer-input" class="form-control" placeholder="اكتب إجابتك هنا..." onkeypress="if(event.key === 'Enter') sendAnswer()">
            <button class="btn btn-primary" onclick="sendAnswer()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script>
    const interviewId = "{{ interview.id }}";
    
    async function handleConsent(choice) {
        const res = await fetch(`/candidate/interview/${interviewId}/consent`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({choice})
        });
        const data = await res.json();
        
        if (choice === 'accepted') {
            document.getElementById('consent-view').style.display = 'none';
            document.getElementById('chat-log').style.display = 'block';
            document.getElementById('chat-footer').style.display = 'block';
            loadNextQuestion();
        } else {
            document.getElementById('consent-view').innerHTML = '<h4>تم إلغاء المقابلة. شكراً لك.</h4>';
        }
    }

    async function loadNextQuestion() {
        document.getElementById('typing').style.display = 'block';
        const res = await fetch(`/candidate/interview/${interviewId}/next`);
        const data = await res.json();
        document.getElementById('typing').style.display = 'none';

        if (data.status === 'question') {
            addMessage(data.text, 'ai');
        } else if (data.status === 'completed') {
            addMessage(data.message, 'ai');
            document.getElementById('chat-footer').style.display = 'none';
        }
    }

    async function sendAnswer() {
        const input = document.getElementById('answer-input');
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'candidate');
        input.value = '';

        await fetch(`/candidate/interview/${interviewId}/answer`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({answer: text})
        });

        loadNextQuestion();
    }

    function addMessage(text, sender) {
        const log = document.getElementById('chat-log');
        const div = document.createElement('div');
        div.className = `bubble ${sender}-bubble`;
        div.innerText = text;
        log.appendChild(div);
        
        const body = document.getElementById('chat-body');
        body.scrollTop = body.scrollHeight;
    }
</script>

</body>
</html>
